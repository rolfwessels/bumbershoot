name: .NET

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RedisHost: localhost
    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: make test
  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      RedisHost: localhost
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.0.x

      - name: make pack
        if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'publish')
        run: make pack

      - name: make publish
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, 'publish')
        env:
          NUGET_KEY: ${{secrets.NUGET_KEY}}
        run: make publish
